name = "smartgr-agenda-tecnicas-calendar"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
ENVIRONMENT = "development"

# Fase 2 — segredos a configurar via `wrangler secret put`:
# GOOGLE_OAUTH_CLIENT_ID
# GOOGLE_OAUTH_CLIENT_SECRET
# GOOGLE_OAUTH_REDIRECT_URI      (https://<esta-url>/oauth/callback)
# TOKEN_ENCRYPTION_KEY           (segredo qualquer, usado p/ criptografar refresh token e assinar o state do OAuth)
# FIREBASE_SERVICE_ACCOUNT_JSON  (conteúdo do JSON da service account do projeto Firebase)
